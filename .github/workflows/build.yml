name: Unix cross-platform

on:
  push:
    branches: [ "main", "master", "actions" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  unix-builds:
    name: Build Unix (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            make_env: ''
            setup_cmd: 'sudo apt-get update && sudo apt-get install -y libsdl2-dev libpng-dev'
            artifact: linux-x86_64

          - os: ubuntu-latest
            arch: i686
            container: 
              image: i386/debian:bookworm
            make_env: 'CC=gcc'
            setup_cmd: 'apt-get update && apt-get install -y build-essential libsdl2-dev libpng-dev'
            artifact: linux-i686

          - os: ubuntu-latest
            arch: armhf
            container: 
              image: ubuntu:noble
            make_env: 'CC=arm-linux-gnueabihf-gcc'
            setup_cmd: |
              dpkg --add-architecture armhf
              sed -i 's/^deb /deb [arch=amd64,i386] /g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || sed -i 's/^deb /deb [arch=amd64,i386] /g' /etc/apt/sources.list
              echo "deb [arch=armhf] http://ubuntu.com noble main universe" | tee /etc/apt/sources.list.d/armhf.list
              apt-get update && apt-get install -y build-essential gcc-arm-linux-gnueabihf libsdl2-dev:armhf libpng-dev:armhf
            artifact: linux-armhf

          - os: macos-latest
            arch: x86_64-darwin
            make_env: 'CC=clang'
            setup_cmd: 'brew install sdl2 libpng'
            artifact: macos-universal

    steps:
    - name: Download code
      uses: actions/checkout@v4

    - name: Setup dependencies
      if: matrix.setup_cmd != ''
      run: ${{ matrix.setup_cmd }}

    - name: Build with make
      run: make arch=${{ matrix.arch }} ${{ matrix.make_env }}
      working-directory: src

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          **/*.so
          **/*.dylib
        if-no-files-found: error
